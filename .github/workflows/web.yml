name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:server-only
      - run: pnpm build

  e2e:
    name: database tests, Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The magic-link redirect must match an allowed URL in supabase/config.toml.
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # Any YouTube URL: the landing page shows its twelfth section (the film) only when one is set.
      NEXT_PUBLIC_VIDEO_URL: https://www.youtube.com/watch?v=aqz-KE-bpKQ
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      # Migrations and supabase/seed.sql load on start: 10 sites, 674 scans.
      - name: Start Supabase
        run: supabase start -x imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Export the local Supabase keys
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|MAILPIT_URL)=' \
            | tr -d '"' >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
