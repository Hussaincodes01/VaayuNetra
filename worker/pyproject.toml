[project]
name = "vayunetra"
version = "0.1.0"
description = "VayuNetra inference worker: Sentinel-2 methane screening for Indian landfills."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "croniter>=2.0",
]

[project.optional-dependencies]
# Model inference. Install torch from the PyTorch index that matches your GPU (see README).
ml = ["torch>=2.2", "segmentation-models-pytorch>=0.3.3"]
ee = ["earthengine-api>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
pdf = ["playwright>=1.44"]
all = ["vayunetra[ml,ee,api,pdf]"]

[project.scripts]
vayu = "vayunetra.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML template and CSS of the site dossier, ported from the ops notebook.
"src/vayunetra/outputs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["parity: re-runs the notebook's 14 landfill flags (needs model zip and cached chips)"]
